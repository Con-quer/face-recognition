[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec"
version = "1.0.0"
description = "基于 OpenCV 与 YOLO11 的实时人脸识别"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8,<5",
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
facerec = "facerec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
